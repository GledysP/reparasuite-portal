name: Integracion Continua Portal

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout del código
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📦 Instalar dependencias
      run: npm ci

    - name: 🚀 Compilar Angular (Build)
      run: npm run build