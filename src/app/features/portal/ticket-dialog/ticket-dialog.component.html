<div class="rs-dialog-container">
  <div class="rs-header-dark">
    <div class="rs-header-topbar">
      <button mat-icon-button mat-dialog-close aria-label="Volver" class="rs-back-btn">
        <mat-icon fontSet="material-symbols-outlined">arrow_back</mat-icon>
      </button>
      <div class="rs-header-title">Nueva solicitud</div>
      <button mat-icon-button aria-label="Opciones" class="rs-options-btn">
        <mat-icon fontSet="material-symbols-outlined">more_vert</mat-icon>
      </button>
    </div>

    <div class="rs-hero-branding">
      <div class="rs-logo-wrapper">
        <img src="assets/logo.png" alt="PAMBYTE" class="rs-logo-img" />
      </div>
      <h1 class="rs-brand-name">Pambyte</h1>
    </div>
  </div>

  <div class="rs-form-card">
    <mat-dialog-content class="rs-content-scroll">
      <form class="rs-form" [formGroup]="form" (ngSubmit)="crear()">
        
        <div class="rs-field-group">
          <label class="rs-label">EQUIPO</label>
          <mat-form-field appearance="fill" class="rs-input-flat" [class.rs-invalid]="isInvalid('equipo')">
            <mat-icon matPrefix fontSet="material-symbols-outlined">devices</mat-icon>
            <input matInput formControlName="equipo" placeholder="Ej. Impresora Industrial XYZ" autocomplete="off" />
          </mat-form-field>
        </div>

        <div class="rs-field-group">
          <label class="rs-label">SERVICIO A REALIZAR</label>
          <mat-chip-listbox multiple formControlName="categoriasTrabajo" class="rs-chips-flat">
            <mat-chip-option value="REPARACION">Reparación</mat-chip-option>
            <mat-chip-option value="MANTENIMIENTO">Mantenimiento</mat-chip-option>
            <mat-chip-option value="INSTALACION">Instalación</mat-chip-option>
          </mat-chip-listbox>
        </div>

        <div class="rs-grid-row-2">
          
          <div class="rs-field-group">
            <label class="rs-label">MODALIDAD</label>
            <mat-form-field appearance="fill" class="rs-input-flat">
              <mat-select formControlName="tipoServicioSugerido" placeholder="En taller">
                <mat-option value="TIENDA">En taller</mat-option>
                <mat-option value="DOMICILIO">A domicilio</mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="rs-field-group">
            <label class="rs-label">EVIDENCIA</label>
            <div class="rs-file-button" (click)="fileInput.click()">
              <input #fileInput type="file" hidden accept="image/*" capture="environment" (change)="onFileSelected($event)" />
              
              <ng-container *ngIf="!selectedFile()">
                <mat-icon fontSet="material-symbols-outlined" class="rs-cyan-icon">photo_camera</mat-icon>
                <span>Foto</span>
              </ng-container>

              <ng-container *ngIf="selectedFile()">
                <div class="rs-file-selected">
                  <span class="rs-filename">{{ selectedFile()?.name }}</span>
                  <button type="button" class="rs-clear-btn" (click)="$event.stopPropagation(); clearFile()">
                    <mat-icon fontSet="material-symbols-outlined">close</mat-icon>
                  </button>
                </div>
              </ng-container>
            </div>
          </div>

        </div>

        <div class="rs-field-group">
          <label class="rs-label">DESCRIPCIÓN</label>
          <mat-form-field appearance="fill" class="rs-input-flat rs-textarea" [class.rs-invalid]="isInvalid('descripcionFalla')">
            <mat-icon matPrefix fontSet="material-symbols-outlined">build</mat-icon>
            <textarea matInput cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3" formControlName="descripcionFalla" placeholder="Problema técnico..."></textarea>
          </mat-form-field>
        </div>

        <div class="rs-field-group">
          <label class="rs-label">UBICACIÓN</label>
          <mat-form-field appearance="fill" class="rs-input-flat rs-textarea">
            <mat-icon matPrefix fontSet="material-symbols-outlined">location_on</mat-icon>
            <textarea matInput cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="2" formControlName="direccion" placeholder="Dirección u oficina..."></textarea>
          </mat-form-field>
        </div>

        <div class="rs-field-group">
          <label class="rs-label">OBSERVACIONES <span class="rs-optional">(OPCIONAL)</span></label>
          <mat-form-field appearance="fill" class="rs-input-flat rs-textarea">
            <textarea matInput cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="2" formControlName="observaciones" placeholder="Info adicional..."></textarea>
          </mat-form-field>
        </div>

      </form>
    </mat-dialog-content>

    <div class="rs-actions">
      <button *ngIf="data.mode !== 'view'" mat-flat-button type="submit" class="rs-btn-submit" (click)="crear()" [disabled]="form.disabled || loading()">
        <ng-container *ngIf="!loading(); else loadingTpl">
          Enviar solicitud <mat-icon fontSet="material-symbols-outlined">send</mat-icon>
        </ng-container>
        <ng-template #loadingTpl>
          <mat-spinner diameter="20" color="accent"></mat-spinner>
        </ng-template>
      </button>
      <button mat-button type="button" mat-dialog-close class="rs-btn-cancel">
        Cerrar
      </button>
    </div>
  </div>
</div>
